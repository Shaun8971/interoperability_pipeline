# Non-secret configuration. Secrets (tokens, private keys) go in .env, never here.

[fhir]
# Base URL of the FHIR R4 server (the hub). Local HAPI started by docker-compose.yml.
base_url = "http://localhost:8080/fhir"
# Seconds to wait for the FHIR server before treating the call as failed.
timeout_seconds = 10

[mllp]
# Where the HL7 v2 listener accepts connections (Module 1).
host = "127.0.0.1"
# 2575 is the port conventionally registered for HL7 over MLLP.
port = 2575
# Seconds the sender waits for an ACK before treating the message as unacknowledged.
ack_timeout_seconds = 3

[portal]
host = "127.0.0.1"  # the portal only listens on this machine
port = 8000
# Which profile below to use. "sandbox" = SMART login against the SMART Health IT sandbox.
# "local" = no login, straight to our own HAPI server. Override: --profile local
profile = "sandbox"

[portal.profiles.sandbox]
# Standalone *patient* launch simulated by https://launch.smarthealthit.org . The long path
# segment is the launcher's own base64url-encoded config: [3 = patient-standalone, ..., 0 = public
# client, 2 = PKCE always required]. Format: smart-launcher-v2 src/isomorphic/codec.ts.
fhir_base_url = "https://launch.smarthealthit.org/v/r4/sim/WzMsIiIsIiIsIkFVVE8iLDAsMCwwLCIiLCIiLCIiLCIiLCIiLCIiLCIiLDAsMiwiIl0/fhir"
auth = "smart"
client_id = "interoperability-pipeline-portal"  # public client: the sandbox needs no registration
redirect_uri = "http://localhost:8000/callback"  # where the browser returns after login
# launch/patient = "let me pick the patient at login"; openid + fhirUser = who logged in;
# the rest = read-only access to the three resource types the portal shows.
scope = "launch/patient openid fhirUser patient/Patient.read patient/Encounter.read patient/ExplanationOfBenefit.read"

[portal.profiles.local]
fhir_base_url = "http://localhost:8080/fhir"  # our HAPI server: open, no login
auth = "none"

[paths]
# Where runtime data goes (git-ignored): the event log and the error queue.
data_directory = "data"
