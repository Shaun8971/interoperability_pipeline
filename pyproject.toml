[project]
name = "interoperability-pipeline"
version = "0.1.0"
description = "Learning project: one synthetic patient through HL7 v2, FHIR, X12 and SMART."
requires-python = ">=3.11"
dependencies = ["requests"]  # HTTP client for the FHIR server

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# HTML templates in the portal are long single-line strings that cannot be wrapped readably.
"src/interoperability_pipeline/portal/server.py" = ["E501"]
